<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Vistoria — Nova Imobiliária</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#F3F4F6;color:#111}
  header{background:#111;color:#fff;padding:14px 28px;font-size:15px;font-weight:600}
  .container{max-width:820px;margin:24px auto;padding:0 16px 80px}
  h2{font-size:15px;font-weight:600;margin-bottom:12px}
  .card{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:20px;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{font-size:12px;color:#666;display:block;margin-bottom:3px}
  input,textarea{width:100%;font-size:13px;padding:8px 10px;border:1px solid #D1D5DB;border-radius:6px;background:#FAFAFA;font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:#6366F1}
  textarea{resize:vertical;min-height:60px}
  .tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid #E5E7EB}
  .tab{padding:10px 22px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px}
  .tab.active{color:#4F46E5;border-bottom:2px solid #4F46E5}
  .tab-content{display:none}.tab-content.active{display:block}
  .amb-card{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px;margin-bottom:12px}
  .amb-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .amb-titulo{font-size:14px;font-weight:600;border:none;background:transparent;padding:0;flex:1;font-family:inherit}
  .amb-titulo:focus{outline:none;border-bottom:1px solid #6366F1}
  .badge{font-size:11px;padding:2px 8px;border-radius:12px;background:#EEF2FF;color:#4F46E5;font-weight:500}
  .btn-foto{display:inline-flex;align-items:center;gap:6px;background:#EEF2FF;color:#4F46E5;border:none;border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .thumb{position:relative;width:90px;height:90px;border-radius:6px;overflow:hidden;border:1px solid #E5E7EB;background:#f9f9f9}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb-rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .btn-add{background:none;border:none;color:#4F46E5;font-size:13px;cursor:pointer;padding:6px 0;font-family:inherit}
  .btn-rm{background:none;border:none;color:#ccc;font-size:15px;cursor:pointer;padding:0 2px}
  .btn-rm:hover{color:#ef4444}
  .btn-gerar{position:fixed;bottom:24px;right:24px;background:#111;color:#fff;border:none;border-radius:10px;padding:14px 28px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.2);font-family:inherit;z-index:100}
  .btn-gerar:hover{background:#333}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
  .overlay.show{display:flex}
  .overlay-box{background:#fff;border-radius:12px;padding:32px 44px;text-align:center;font-size:14px;color:#444}
  .spinner{font-size:30px;display:block;margin-bottom:12px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>Nova Imobiliária — Gerador de Termo de Vistoria</header>
<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="aba('dados',this)">1. Dados das partes</button>
    <button class="tab" onclick="aba('fotos',this)">2. Fotos por ambiente</button>
  </div>

  <!-- DADOS -->
  <div id="tab-dados" class="tab-content active">
    <div class="card">
      <h2>Locador</h2>
      <div class="grid2">
        <div><label>Nome completo</label><input id="locador" placeholder="Nome do locador"></div>
        <div><label>CPF</label><input id="locadorCpf" placeholder="000.000.000-00"></div>
      </div>
    </div>
    <div class="card">
      <h2>Locatário</h2>
      <div class="grid2">
        <div><label>Nome completo</label><input id="locatario" placeholder="Nome do locatário"></div>
        <div><label>CPF</label><input id="locatarioCpf" placeholder="000.000.000-00"></div>
      </div>
    </div>
    <div class="card">
      <h2>Imóvel</h2>
      <div style="margin-bottom:12px"><label>Endereço completo</label><input id="endereco" placeholder="Rua, nº, bairro, cidade/SP, CEP"></div>
      <div class="grid2">
        <div><label>Tipo</label><input id="tipo" placeholder="ex: casa, apartamento"></div>
        <div><label>Composição</label><input id="composicao" placeholder="ex: sala, 2 quartos, banheiro"></div>
      </div>
    </div>
    <div class="card">
      <div class="grid2">
        <div><label>Data da vistoria</label><input id="dataVistoria" type="date"></div>
        <div><label>Quantidade de chaves</label><input id="chaves" type="number" placeholder="ex: 3" min="1"></div>
      </div>
    </div>
    <div class="card">
      <h2>Observações gerais</h2>
      <textarea id="obsGerais" placeholder="Informações adicionais..." style="min-height:80px"></textarea>
    </div>
  </div>

  <!-- FOTOS -->
  <div id="tab-fotos" class="tab-content">
    <div id="listaAmb"></div>
    <button class="btn-add" onclick="novoAmb()">+ Adicionar ambiente</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <span class="spinner">⏳</span>
    Gerando PDF com as fotos...<br>
    <small style="color:#999;margin-top:6px;display:block">Aguarde, isso pode levar alguns segundos.</small>
  </div>
</div>

<button class="btn-gerar" onclick="gerarPDF()">⬇ Gerar PDF</button>

<script>
const {jsPDF} = window.jspdf;
const ROMANOS = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
const AMBIENTES_PADRAO = [
  ["Área externa / fachada","Muros e paredes externas: íntegros, sem trincas aparentes ou sinais visíveis de infiltração. Portão: metálico, com abertura e fechamento regulares, sem empenamentos aparentes."],
  ["Sala","Piso: assentado, sem trincas ou peças soltas aparentes. Paredes: com pintura uniforme, sem manchas aparentes. Teto/laje: sem fissuras aparentes. Portas e janelas: em funcionamento regular, com vidros íntegros e ferragens fixadas."],
  ["Cozinha","Piso: em bom estado de conservação, sem quebras aparentes. Paredes: revestidas, sem desplacamentos ou umidade visível. Pia e torneira: fixadas, sem vazamentos aparentes. Instalações hidráulicas e elétricas aparentes: sem irregularidades visíveis."],
  ["Dormitórios","Piso: íntegro, sem danos aparentes. Paredes: pintura uniforme, sem manchas aparentes. Portas e janelas: em funcionamento regular."],
  ["Banheiro(s)","Piso e revestimentos: íntegros, sem peças soltas ou trincas aparentes. Vaso sanitário: fixado, com acionamento regular. Torneira: sem vazamentos aparentes. Ralos: desobstruídos no momento da vistoria."],
  ["Quintal / área de serviço",""],
];

// Cada ambiente: {nome, obs, fotos:[base64,...]}
let ambs = [];

function aba(id, btn){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
}

function novoAmb(nome="Novo ambiente", obs=""){
  const i = ambs.length;
  ambs.push({nome, obs, fotos:[]});
  renderAmb(i);
}

function renderAmb(i){
  const old = document.getElementById('a'+i);
  if(old) old.remove();
  const a = ambs[i];
  const d = document.createElement('div');
  d.className='amb-card'; d.id='a'+i;
  d.innerHTML = `
    <div class="amb-header">
      <input class="amb-titulo" value="${esc(a.nome)}" oninput="ambs[${i}].nome=this.value">
      <span class="badge" id="b${i}">${a.fotos.length} foto(s)</span>
      <button class="btn-rm" onclick="rmAmb(${i})">✕</button>
    </div>
    <label>Observações</label>
    <textarea oninput="ambs[${i}].obs=this.value" placeholder="Estado do ambiente...">${a.obs}</textarea>
    <div style="margin-top:10px">
      <button class="btn-foto" onclick="document.getElementById('fi${i}').click()">📷 Selecionar fotos</button>
      <input type="file" id="fi${i}" multiple accept="image/*" style="display:none" onchange="lerFotos(this,${i})">
      <div class="thumbs" id="t${i}"></div>
    </div>`;
  document.getElementById('listaAmb').appendChild(d);
  renderThumbs(i);
}

function rmAmb(i){ ambs[i]=null; document.getElementById('a'+i)?.remove(); }

function esc(s){ return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// Lê arquivos e converte DIRETO para base64 — sem URL.createObjectURL
function lerFotos(input, i){
  Array.from(input.files).forEach(f=>{
    const r = new FileReader();
    r.onload = e => {
      ambs[i].fotos.push(e.target.result); // já é data:image/...;base64,...
      renderThumbs(i);
    };
    r.readAsDataURL(f);
  });
  input.value='';
}

function renderThumbs(i){
  const c = document.getElementById('t'+i); if(!c) return;
  c.innerHTML='';
  ambs[i].fotos.forEach((src,fi)=>{
    const d = document.createElement('div');
    d.className='thumb';
    // img com src base64 — sem dependência de arquivo local
    d.innerHTML=`<img src="${src}"><button class="thumb-rm" onclick="rmFoto(${i},${fi})">×</button>`;
    c.appendChild(d);
  });
  const b = document.getElementById('b'+i);
  if(b) b.textContent = ambs[i].fotos.length+' foto(s)';
}

function rmFoto(i,fi){ ambs[i].fotos.splice(fi,1); renderThumbs(i); }

// Inicializa
AMBIENTES_PADRAO.forEach(([n,o])=>novoAmb(n,o));
document.getElementById('dataVistoria').valueAsDate = new Date();

// ── PDF ─────────────────────────────────────────────────────────────────────
function vl(id){ return document.getElementById(id).value.trim(); }

function fmtData(raw){
  if(!raw) return new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  const [y,m,d]=raw.split('-');
  return new Date(+y,+m-1,+d).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
}

// Redimensiona base64 via canvas e retorna novo base64 — tudo em memória, sem CORS
function resizeBase64(b64, maxW=1200, maxH=900){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      const ratio = Math.min(maxW/w, maxH/h, 1);
      w=Math.round(w*ratio); h=Math.round(h*ratio);
      const cv = document.createElement('canvas');
      cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      resolve({b64: cv.toDataURL('image/jpeg',0.82), w, h});
    };
    img.onerror = ()=>resolve(null);
    img.src = b64; // base64 direto — sem file:// — sem bloqueio de CORS
  });
}

async function gerarPDF(){
  document.getElementById('overlay').classList.add('show');
  await new Promise(r=>setTimeout(r,60));

  try{
    const doc = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const PW=210, PH=297, ML=20, MR=20, MT=18, MB=22;
    const CW=PW-ML-MR;
    let y=MT;

    function checkY(n=20){ if(y+n>PH-MB){doc.addPage();y=MT;} }

    function paragrafo(txt, x, maxW, size, style, color=[0,0,0]){
      doc.setFontSize(size); doc.setFont('helvetica',style); doc.setTextColor(...color);
      const lines = doc.splitTextToSize(txt, maxW);
      lines.forEach(l=>{ checkY(size*0.45); doc.text(l,x,y); y+=size*0.45; });
      return y;
    }

    // Cabeçalho
    doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(120,120,120);
    doc.text('Nova Imobiliária — Rua Saldanha Marinho, 574 - Centro - VGSul/SP — (19) 3643-1641 | (19) 99224-3434 | novaimobiliariavgs@gmail.com', PW/2, y, {align:'center'});
    y+=4;
    doc.setDrawColor(180,180,180); doc.setLineWidth(0.3); doc.line(ML,y,PW-MR,y); y+=6;

    // Título
    doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.setTextColor(0,0,0);
    doc.text('TERMO DE VISTORIA E ENTREGA DE CHAVES', PW/2, y, {align:'center'}); y+=9;

    // Campos das partes — bold + normal na mesma linha
    function linhaCampo(bold, resto){
      checkY(8);
      doc.setFontSize(11);
      doc.setFont('helvetica','bold'); doc.setTextColor(0,0,0);
      const bw = doc.getTextWidth(bold);
      doc.text(bold, ML, y);
      doc.setFont('helvetica','normal');
      const wrap = doc.splitTextToSize(resto, CW-bw-1);
      doc.text(wrap[0], ML+bw, y); y+=11*0.48;
      for(let k=1;k<wrap.length;k++){ checkY(7); doc.text(wrap[k],ML,y); y+=11*0.48; }
      y+=1;
    }

    const locador    = vl('locador')     || '___________________';
    const locadorCpf = vl('locadorCpf')  || '___________';
    const locatario  = vl('locatario')   || '___________________';
    const latCpf     = vl('locatarioCpf')|| '___________';
    const endereco   = vl('endereco')    || '___________________';
    const tipo       = vl('tipo')        || 'imóvel';
    const comp       = vl('composicao');
    const chaves     = vl('chaves')      || '__';
    const obsG       = vl('obsGerais');
    const dataVist   = fmtData(vl('dataVistoria'));

    linhaCampo('LOCADOR: ', `${locador}, inscrito no CPF sob nº ${locadorCpf}.`);
    linhaCampo('LOCATÁRIO: ', `${locatario}, inscrito no CPF/MF sob nº ${latCpf}.`);
    linhaCampo('ADMINISTRADORA: ', 'Nova Imobiliária, pessoa jurídica de direito privado, inscrita no CNPJ sob nº 48.359.840/0001-71, com endereço na Rua Saldanha Marinho, nº 574, Vargem Grande do Sul – SP, CEP 13.880-000.');
    linhaCampo('OBJETO DA LOCAÇÃO: ', `${tipo}${comp?', composto por '+comp:''}, situado na ${endereco}.`);
    y+=3;

    paragrafo('Pelo presente, declaram as partes que o imóvel se encontra em estado de conservação conforme descrito abaixo, cuja identificação se dá também pelas fotografias tiradas nesta data e que compõem este Termo de Vistoria.', ML, CW, 11, 'normal');
    y+=5;

    // Ambientes
    const ativos = ambs.filter(a=>a!==null);
    for(let ai=0; ai<ativos.length; ai++){
      const amb = ativos[ai];
      const num = ROMANOS[ai]||String(ai+1);
      checkY(16);
      doc.setDrawColor(30,30,30); doc.setLineWidth(0.7); doc.line(ML,y,PW-MR,y); y+=5;
      doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(0,0,0);
      doc.text(`${num} – ${amb.nome.toUpperCase()}`, ML, y); y+=6;
      if(amb.obs){ paragrafo(amb.obs, ML, CW, 10, 'normal'); y+=2; }

      // Fotos — base64 já prontas, só redimensionar via canvas
      if(amb.fotos.length>0){
        const FW=(CW-6)/2;
        const FH=FW*0.65;
        for(let fi=0; fi<amb.fotos.length; fi+=2){
          checkY(FH+5);
          for(let fj=0; fj<2; fj++){
            if(fi+fj>=amb.fotos.length) break;
            const res = await resizeBase64(amb.fotos[fi+fj]);
            if(!res) continue;
            const fx = ML+fj*(FW+6);
            doc.setDrawColor(200,200,200); doc.setLineWidth(0.3);
            doc.rect(fx, y, FW, FH);
            doc.addImage(res.b64, 'JPEG', fx, y, FW, FH);
          }
          y+=FH+5;
        }
      }
      y+=4;
    }

    if(obsG){ checkY(14); linhaCampo('OBSERVAÇÕES GERAIS: ', obsG); y+=2; }

    checkY(16);
    doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(0,0,0);
    const cw2=doc.getTextWidth(chaves+' chave(s)');
    doc.text(chaves+' chave(s)', ML, y);
    doc.setFont('helvetica','normal');
    doc.text(' entregue(s) ao locatário nesta data.', ML+cw2, y); y+=7;
    paragrafo(`Por fim, declaram estarem justos e de acordo com a entrega das chaves do imóvel na data de ${dataVist}.`, ML, CW, 11, 'normal');
    y+=4;
    doc.setFont('helvetica','bold'); doc.text('Local/Data: ',ML,y);
    const ldw=doc.getTextWidth('Local/Data: ');
    doc.setFont('helvetica','normal'); doc.text(`Vargem Grande do Sul, ${dataVist}.`,ML+ldw,y); y+=14;

    // Assinaturas
    ['LOCADOR(A)','ADMINISTRADORA — Nova Imobiliária','LOCATÁRIO(A)'].forEach(l=>{
      checkY(20);
      doc.setDrawColor(0); doc.setLineWidth(0.5); doc.line(ML,y,ML+70,y); y+=4;
      doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(0,0,0);
      doc.text(l,ML,y); y+=14;
    });

    checkY(28);
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('TESTEMUNHAS',ML,y); y+=8;
    doc.setDrawColor(0); doc.setLineWidth(0.5);
    doc.line(ML,y,ML+65,y); doc.line(ML+80,y,ML+145,y); y+=4;
    doc.setFont('helvetica','normal');
    doc.text('Nome: _____________________',ML,y); doc.text('Nome: _____________________',ML+80,y); y+=5;
    doc.text('RG: _________________________',ML,y); doc.text('RG: _________________________',ML+80,y);

    doc.save('Termo_Vistoria_Nova_Imobiliaria.pdf');
  } catch(e){
    alert('Erro ao gerar PDF:\n'+e.message);
    console.error(e);
  } finally {
    document.getElementById('overlay').classList.remove('show');
  }
}
</script>
</body>
</html>
